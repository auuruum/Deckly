[workspace]
resolver = "3"
default-members = ["xtask"]
members = [
    "xtask",
    "crates/deckly",
    "crates/deckly-core",
    "crates/deckly-device",
    "crates/deckly-plugin-host",
    "crates/deckly-plugin-protocol",
    "crates/deckly-sdk",
    "crates/deckly-web",
    "examples/counter-plugin",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
deckly-core = { path = "crates/deckly-core" }
deckly-device = { path = "crates/deckly-device" }
deckly-plugin-host = { path = "crates/deckly-plugin-host" }
deckly-plugin-protocol = { path = "crates/deckly-plugin-protocol" }
deckly-sdk = { path = "crates/deckly-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
