# Runs the CI checks (formatting, clippy, tests on every system), then builds
# the release archives; nothing is built when a check fails. On a `v*` tag it
# also creates a draft GitHub release with the archives, their checksums, the
# Homebrew formula and the AUR package, only when every build succeeded.
# Publish the draft by hand after checking it.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "xtask/**"
      - "packaging/**"
      - "install.sh"
      - "install.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binaries run on older glibc.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, setup: --setup }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the archive
        run: cargo dev dist --target ${{ matrix.target }} ${{ matrix.setup }}

      - uses: actions/upload-artifact@v4
        with:
          name: deckly-${{ matrix.target }}
          path: |
            dist/deckly-${{ matrix.target }}.*
            dist/deckly-setup-*.exe
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum deckly-* > SHA256SUMS && cat SHA256SUMS

      - name: Homebrew formula and AUR package
        run: |
          cargo dev release-files --tag "$GITHUB_REF_NAME" --checksums dist/SHA256SUMS --out dist/packages
          tar -czf dist/aur-deckly-bin.tar.gz -C dist/packages/aur .

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Deckly $GITHUB_REF_NAME" --generate-notes \
            dist/deckly-*.tar.gz dist/deckly-*.zip dist/deckly-setup-windows-x64.exe dist/SHA256SUMS \
            dist/packages/deckly.rb dist/aur-deckly-bin.tar.gz
