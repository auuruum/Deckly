[package]
name = "deckly-plugin-host"
description = "Host side of the Stream Deck SDK plugin protocol for Deckly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
# WebSocket server for plugins and property inspectors (pure Rust, no TLS).
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# `.streamDeckPlugin` archives are zip files; deflate through zlib-rs (pure Rust).
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
uuid = { version = "1.29.0", features = ["v4"] }
# Checks Node.js downloads against the release's SHA-256 list.
sha2 = "0.10.9"

[lints]
workspace = true
