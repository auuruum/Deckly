[package]
name = "deckly-web"
description = "Helper process that runs plugin web pages (HTML plugins, property inspectors) for Deckly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
# The system web view: WebView2 (Windows), WKWebView (macOS), WebKitGTK
# (Linux). It runs only in this helper process, never in the editor.
wry = { version = "0.57.1", features = ["devtools"] }
tao = "0.37.2"

[target.'cfg(windows)'.dependencies]
# Already used by Wry; handles native popup close requests in the helper.
webview2-com = "0.39.1"

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
