[package]
name = "deckly"
description = "Unofficial, independent app for Stream Deck hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
deckly-core.workspace = true
deckly-device.workspace = true
deckly-plugin-host.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui-phosphor = "0.14.0"
# Key image rendering: decode custom PNG/JPEG images and the WebP and GIF
# pictures of imported profiles, encode device JPEGs (and BMPs for the Mini
# family).
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ab_glyph = "0.2.32"
# Plugins send and ship SVG key images; text in them uses system fonts.
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
# Native file dialogs (Win32, xdg-portal, AppKit); no GTK.
rfd = "0.17.2"
# Backups and the official app's backup files are zip archives; already in
# the tree through deckly-plugin-host.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
uuid = { version = "1.29.0", features = ["v4"] }
# Checks update downloads against the release checksums; already in the
# tree through deckly-plugin-host.
sha2 = "0.10.9"
# Compares release versions; small, pure Rust, already in Cargo.lock.
semver = "1.0.28"
# Private, seekable files for the optional video converter.
tempfile = "3.27.0"
# The tray icon. `ksni` talks D-Bus from Rust on Linux; no GTK.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Plugin secrets in Credential Manager.
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Asks whether a tray exists, talks to media players, to the remote desktop
# portal and to logind; already in the tree through accesskit.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# Simulated input: the Wayland virtual keyboard, the clipboard for what keys
# cannot carry, XTEST and /dev/uinput. All pure Rust, and already in the tree
# through winit, except for the XTEST feature.
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", default-features = false, features = ["xtest"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "fs", "pipe", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Simulated input through Quartz events; already in the tree through winit.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGSession"] }
# Lock screen notifications; already in the tree through objc2-core-graphics.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNotificationCenter", "CFNumber", "CFString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "NSRunningApplication", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSResponder", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSGeometry", "NSNotification", "NSOperation", "NSString", "NSURL"] }
# Blocks for notification observers; already in the tree through AppKit.
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
# Autorelease pools for native icon previews on the background worker; already
# in the dependency tree through AppKit and winit.
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
# Keeps a start in the tray from taking the focus at login; already in the
# tree through eframe.
winit = { version = "0.30.13", default-features = false }

[lints]
workspace = true
