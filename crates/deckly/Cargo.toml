[package]
name = "deckly"
description = "Unofficial, independent app for Stream Deck hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
deckly-core.workspace = true
deckly-device.workspace = true
deckly-plugin-host.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui-phosphor = "0.14.0"
# Key image rendering: decode custom PNG/JPEG images, encode device JPEGs
# (and BMPs for the Mini family).
image = { version = "0.25.10", default-features = false, features = ["bmp", "png", "jpeg"] }
ab_glyph = "0.2.32"
# Plugins send and ship SVG key images; text in them uses system fonts.
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
# Native file dialogs (Win32, xdg-portal, AppKit); no GTK.
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
